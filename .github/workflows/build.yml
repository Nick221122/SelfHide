name: Build PieChart
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run tests and build mod
        run: gradle --no-daemon clean test build
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: PieChart-Minecraft-26.3
          path: build/libs/*.jar
          if-no-files-found: error
